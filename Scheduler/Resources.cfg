# Resource requests for scheduler job scripts, one line per script.
# Edit this file to tune resources for a particular cluster instead of
# editing every job script individually. Scheduler-Sub.sh reads it and
# passes the values to qsub (-l select=...) or sbatch (--cpus-per-task,
# --mem, --time), whichever is used to submit the job.
#
# script                                                ncpus  mem_gb  walltime  partition
#
# partition is a comma-separated list of Slurm partitions the job is
# eligible for (--partition=a,b,c), or blank to stay on the cluster's
# own default partition/queue. Slurm places the job into whichever
# listed partition can start it soonest, automatically skipping any
# whose own time limit is shorter than this line's walltime - the
# closest thing Slurm has to PBS Pro's routing queues (which pick an
# execution queue from the resource request automatically, without the
# submitter naming one at all; true routing needs admin-side
# configuration - a job_submit plugin - which isn't something this repo
# can set up itself). List every partition whose own time limit
# (`sinfo`) is >= this line's walltime, among the ones meant for
# general-purpose batch compute; leave out specialised pools (this
# cluster also has fat/gpu/vis/vascunet, none listed below) unless a
# job actually needs that hardware, and leave out `interactive` too -
# despite being general-purpose hardware, it's meant for live/debug
# sessions, not batch jobs, so none of these lines list it.
#
# For PBS Pro, only a single queue name (no comma) is passed via -q;
# a comma-separated list here is simply not passed to qsub at all, so
# PBS's own default/routing queue handles placement instead - PBS has
# no equivalent of Slurm's multi-partition candidate list.
#
# AskForWholeNode is not a script name - it's a named profile that
# Scheduler-Call.sh asks Scheduler-Sub.sh for (via -R) instead of a
# script's own line, when NeedsBuilding.sh says the local Uniprot BLAST
# databases still need to be built. makeblastdb ignores its assigned CPU
# count and grabs everything on the node it lands on, so this asks for
# the whole node instead: on Slurm, Scheduler-Sub.sh turns this profile
# into `--exclusive` and ignores the ncpus/mem below entirely, so it
# auto-sizes to whatever node it lands on.
#
# Because of that, a PENDING AskForWholeNode job will show a misleadingly
# tiny request in squeue/scontrol - e.g. "NumCPUs=1 ... mem=2G" - since
# --exclusive is a scheduling constraint ("give this job the whole node,
# don't let anything share it"), not a TRES size request, and nothing
# else was given for cpus/mem either. That's just sbatch's own bare
# minimum default for the unset fields while nothing's allocated yet
# (AllocTRES=(null)); once it actually starts, --exclusive still means
# it gets that whole node's real CPUs/memory, not 1 CPU/2G. Confirmed
# 2026-07-27 - looked like a resource-request bug at first glance, it
# wasn't.
#
# PBS Pro has no equivalent
# auto-sizing, so its `-l place=excl` (also added by Scheduler-Sub.sh for
# this profile) still needs the ncpus/mem below to size the select
# statement - those are still just the old cluster's biggest node size,
# and only matter for PBS; resize them if moving to a new PBS cluster.
#
# The mem_gb column below is passed to Slurm as `--mem=${mem}G`, and
# Slurm's G suffix means binary GiB (x1024), not decimal GB - so it must
# stay strictly below a node's true usable memory, not just at or under
# its "nice round number" advertised size. Confirmed 2026-07-28: this
# cluster's standard/long nodes report exactly 257000 MB (`sinfo -o "%m"`),
# and a mem_gb of 251 here becomes a `--mem=257024M` request - 24 MB over
# that ceiling on every node in both partitions - which Slurm reports as
# PENDING (BadConstraints), not a transient/queueable state: it will never
# start as submitted. Keep mem_gb here comfortably under the true node
# ceiling (converted from MB to GiB, not just below the RAM stick size).
#
# The true whole-node ceiling is lower still - confirmed 2026-08-07
# (`scontrol show node`): every node also has MemSpecLimit=2048 (2048 MB
# reserved for Slurm's own daemon/system overhead, on top of the raw
# RealMemory=257000 that `sinfo -o "%m"` reports), so the actual
# schedulable maximum is 257000-2048=254952 MB (~248.98 GiB), not
# 257000. A mem_gb of 250 here (256000 MB) is a genuinely different
# failure mode than the 251 case above - not PENDING/BadConstraints, but
# an immediate `sbatch: error: Requested node configuration is not
# available` at submission time, since no node's definition can ever
# satisfy it. 248 leaves real margin under 254952 MB either way.
#
# 10_Scheduler-Long-MakeTreeWithIQ-Tree.sh's ncpus/mem_gb (24/62) are
# sized so 4 of these jobs pack onto one 96-cpu/257000 MB node at once
# (4x24=96 cpus, 4x62 GiB=253952 MB, 3048 MB headroom) instead of one
# job claiming a whole node for itself - IQ-Tree's own model-testing
# phase warned "96 threads for alignment length 382 will slow down
# analysis" on this job's actual per-part alignments, and real usage
# (`sstat -j <id>.batch`) showed under 5 GB RSS in practice, so a full
# node per job was both slower and mostly wasted. If mem_gb is ever
# raised here, keep 4*mem_gb (in MiB) under the node ceiling above, not
# just ncpus*4 under the cpu count.
#
# mem_gb for RegTCoffee/LINSI/PASTA/FAMSA/MAGUS (step 9) and
# 10_Scheduler-MakeTreeWithIQ-Tree.sh (step 10) were re-sized 2026-08-10
# from real usage, not guessed - see Scheduler/ResourceUsageAnalysis/
# (its own README documents the methodology and gotchas). RegTCoffee in
# particular had been sized off the pre-fix t-coffee's crash-mode memory
# blowup (up to 97GB before an OOM-kill), not genuine need - real
# successful runs use under 1GB. ClustalO/MAFFT/MUSCLE/MUSCLE5/SUPER5
# are deliberately left untouched - zero genuine-work memory samples
# exist for them in the logs analyzed (their real runs predate the
# 2026-07-28 sstat logging fix), so there's no data to size from yet.
#
# 10_Scheduler-MakeTreeWithIQ-Tree.sh's walltime (24h -> 30h) covers a
# real, aligner-specific risk found the same day: MAGUS's alignments hit
# IQ-Tree's UFBoot non-convergence path (silently capped at 1000
# iterations, then just returns the best tree found) far more often than
# every other aligner - 19.6% of MAGUS's normal-sized runs exceeded 8h
# (max 22.85h) vs 0% for every other aligner at the same size, and it's
# unrelated to alignment size (fewer sites/taxa didn't predict it).
# 1000 iterations x the worst per-iteration cost seen at normal chunk
# size (~87s) is ~24.2h - already past the old 24h ceiling on its own,
# independent of noTrimAl. This line is shared across every aligner (no
# per-aligner granularity here), so the bump has to cover MAGUS's risk
# for everyone rather than only MAGUS. noTrimAl chunks (explicitly a
# comparison-only path, not meant for BigTree scale) push this further
# still - real site counts up to ~20x higher than trimmed, walltime up
# to 21-24h even for the well-behaved aligners - but that's handled by
# routing noTrimAl through the Long/72h script instead of trying to
# extend this shared budget to cover it too; see Scheduler-Call.sh's
# own step-10 case for that routing decision.
#
# 11_Scheduler-RemoveRogues.sh's walltime (1h -> 24h) is a rough,
# generous bump rather than a data-driven number like the ones above -
# confirmed 2026-08-10 that MAGUS.BigTree0's RemoveRogues run (job
# 8520244, 13300 taxa) hit the old 1h ceiling and got killed with no
# resume logic (unlike step 10's checkpoint/resubmit path, a step-11
# timeout just dies), but that's the only BigTree-scale sample so far
# (1 of 21 RemoveRogues runs logged) and it never actually finished, so
# there's no real completion time to size against yet - same shared-
# line situation as step 10 (this line covers every round regardless of
# scale), same low-cost-to-over-request reasoning.
#
# The killed job's own output was dominated by a flood of RogueNaRok-
# parallel's native "ERROR: Cannot find tree species: X" / "will drop
# 0" pairs (6562 lines in that one hour) - confirmed harmless/routine,
# not a bug: a normal, fast, successful 929-taxon RemoveRogues run
# (job 8478802, 7m24s total) produces 3564 of the exact same messages.
# What IS concerning: throughput comparison between the two suggests
# worse-than-linear scaling. The small run did ~1326 output lines/min;
# the BigTree0 run, killed, only managed ~109 lines/min - about 12x
# slower throughput for only ~14x more taxa. If RogueNaRok-parallel's
# own taxon-matching is roughly O(n^2) in taxon count (plausible for an
# old, 2011, likely-unmaintained tool not built with ~13000-taxon
# inputs in mind), 24h may still not be enough - this bump is "better
# than 1h", not confirmed sufficient. No way to know without either a
# completed BigTree0 run to measure against, or reading RogueNaRok's
# own C/C++ source (out of scope here - it's an external compiled
# tool, not something this repo controls).
#
# 14_Scheduler-AlignWithPASTAForPruning.sh's mem_gb (30 -> 8) and
# walltime (8h -> 24h), 2026-08-13, from real PeptideReceptors/Mas1
# usage. Memory: `sstat -j <id>.batch` MaxRSS across 54 completed step-14
# chunks ranged 1.61-4.14 GB (avg 2.49 GB); combined with step 9's own
# PASTA usage (0.51-1.43 GB across 27 non-trivial chunks, its own
# separate 6 GB line above), nothing PASTA-related here has ever gone
# above 4.14 GB - 8 GB leaves ~2x headroom over the worst case seen in
# either step. Walltime: 5 of 220 chunks in one PeptideReceptors array
# job hit the old 8h ceiling mid-run (all on node069, all killed during
# PASTA's Step 2 of its default 3-iteration budget - see run_pasta.py's
# own --iter-limit, default 3), each having already spent ~7h on
# iterations 0 and 1 alone. Confirmed there is no way to resume a killed
# attempt: run_pasta.py leaves real, complete per-iteration checkpoint
# files behind (`_temp_iteration_<N>_{seq_alignment.txt,
# seq_unmasked_alignment.gz,tree.tre}`), but on any resubmission under
# the same job name it just silently renames itself (e.g. "part_005" ->
# "part_0051") to avoid clobbering them rather than resuming from them -
# tested directly against a real killed chunk's checkpoint files, see
# 09_AlignWithPASTA.sh's own cleanup-branch comment for why they still
# get wiped rather than kept around for no benefit. So every attempt is
# a genuine cold start; 24h is sized to let a chunk like those 5 actually
# finish in one attempt instead of repeatedly dying at the same point.
