# Resource requests for scheduler job scripts, one line per script.
# Edit this file to tune resources for a particular cluster instead of
# editing every job script individually. Scheduler-Sub.sh reads it and
# passes the values to qsub (-l select=...) or sbatch (--cpus-per-task,
# --mem, --time), whichever is used to submit the job.
#
# script                                                ncpus  mem_gb  walltime
#
# AskForWholeNode is not a script name - it's a named profile that
# Scheduler-Call.sh asks Scheduler-Sub.sh for (via -R) instead of a
# script's own line, when NeedsBuilding.sh says the local Uniprot BLAST
# databases still need to be built. makeblastdb ignores its assigned CPU
# count and grabs everything on the node it lands on, so this sizes the
# job to the whole node instead. Still just the old cluster's biggest
# node size - resize for a new cluster's node.
