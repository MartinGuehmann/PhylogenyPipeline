# Compute node names to keep every job off, cluster-wide, until removed
# from this file - read directly by Scheduler-Sub.sh (see its own
# header comment), so it applies automatically to every job submitted
# anywhere in the whole pipeline (the --continue chain from
# 13_RestartProcessing.sh included), not just a single manually-flagged
# invocation. One node name per line, exactly as it appears in squeue's
# NODELIST column (e.g. "node032") - not a script path, not case-
# insensitive. Blank lines and lines starting with # are ignored.
#
# This exists for the same reason SkippedAligners.cfg does: something
# that needs to apply pipeline-wide without touching every caller, so
# turning it back on later (once a node's problem is actually fixed) is
# just deleting a line here. Combined with any --exclude/-N given
# directly on the command line (both apply together), not replaced by
# it.

# node032: confirmed 2026-08-10, twice across separate job submissions
# (jobs 8562855 and 8563380 on Mas1) - raxml-ng and even nix itself
# came back "command not found" there specifically, even after
# Enter-NixDevShell.sh's own devShell-activation check passed and
# 09a_PostProcessAlignment.sh's retry re-sourced nix's profile scripts
# directly. Looks like a broken/unreachable /nix mount on this node
# specifically, not a per-package or transient timing issue - see
# commit history around this date. Remove once the node's actually
# fixed (worth checking with cluster admins first).
node032
