# Aligner names to skip entirely when Scheduler-16-TreeBuildScheduler.sh
# resubmits incomplete work for every "other" aligner alongside a gene's
# main one (the loop over 09_Scheduler-AlignWith*.sh - see 13_Restart-
# Processing.sh's own chain into that script). One aligner name per
# line, matching the <Name> in 09_Scheduler-AlignWith<Name>.sh exactly
# (e.g. VCMSA, MAGUS, FAMSA) - not a script path, not case-insensitive.
# Blank lines and lines starting with # are ignored.
#
# This exists so a whole aligner can be turned off pipeline-wide without
# touching 09_Scheduler-AlignWith<Name>.sh itself or anything that calls
# it - e.g. if an aligner turns out not to be worth pursuing, list it
# here instead of removing its caller, so turning it back on later is
# just deleting a line.

VCMSA
